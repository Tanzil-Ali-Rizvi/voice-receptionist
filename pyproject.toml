[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-receptionist"
version = "0.1.0"
description = "Bilingual (Hindi/English/Hinglish) voice receptionist for a clinic: speech in, tool-calling LLM with deterministic safety rails, speech out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tanzil Ali Rizvi" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "tzdata"]

[project.optional-dependencies]
llm = ["llm-gateway @ git+https://github.com/Tanzil-Ali-Rizvi/llm-gateway@main"]
speech = ["edge-tts>=7.2", "gTTS>=2.5"]
eval = ["jiwer>=4.0", "pyyaml>=6", "datasets>=3", "soundfile>=0.12"]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
